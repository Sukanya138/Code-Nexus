# Render deployment configuration
# This file tells Render how to build and run your backend

services:
  - type: web
    name: codenexus-backend
    runtime: docker
    plan: starter  # Change to 'standard' for production
    region: oregon  # Change to your preferred region
    autoDeploy: true
    
    envVars:
      - key: DB_URL
        sync: false  # Set via Neon dashboard
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: "https://code-nexus-teal.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://code-nexus-teal.vercel.app"
      - key: TOKEN_ENCRYPTOR_PASSWORD
        sync: false
      - key: TOKEN_ENCRYPTOR_SALT
        sync: false
      - key: PORT
        value: "8080"
